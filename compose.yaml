services:
  python:
    platform: linux/amd64
    image: weather-mlops:mlflow-3.10.1
    build: &runtime-build
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim-bookworm
        ENV PYTHONUNBUFFERED=1 PYTHONDONTWRITEBYTECODE=1 MPLCONFIGDIR=/tmp/matplotlib
        WORKDIR /app
        RUN apt-get update \
            && apt-get install -y --no-install-recommends \
               build-essential libgomp1 ca-certificates pkg-config libssl-dev git \
            && rm -rf /var/lib/apt/lists/*
        RUN pip install --no-cache-dir --only-binary=hops-deltalake \
            "hopsworks[python]==5.0.7" "mlflow==3.10.1" \
            "opentelemetry-api==1.27.0" "opentelemetry-sdk==1.27.0" \
            "opentelemetry-proto==1.27.0" \
            "numpy==2.2.6" "pandas==2.2.3" "scikit-learn==1.6.1" \
            "matplotlib==3.10.1" "joblib==1.4.2" "requests==2.32.5" \
            "python-dotenv==1.1.1" \
            && pip check
        RUN python -c "import hopsworks, deltalake, mlflow, mlflow.sklearn, pandas, sklearn, matplotlib"
        CMD ["sleep", "infinity"]
    init: true
    command: ["python", "-u", "/app/src/collector.py"]
    restart: unless-stopped
    stop_grace_period: 920s
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: windisch_temperature_3h
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false

  mlflow:
    platform: linux/amd64
    image: weather-mlops:mlflow-3.10.1
    build: *runtime-build
    init: true
    restart: unless-stopped
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artifacts
      - --allowed-hosts=mlflow:5000,localhost:*,127.0.0.1:*,*.app.github.dev
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 30s

volumes:
  mlflow-data:
